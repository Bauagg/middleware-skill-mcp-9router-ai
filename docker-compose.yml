# Middleware skill untuk 9Router, dijalankan di VPS.
#
#   docker compose up -d --build     # build dari kode di folder ini lalu jalankan
#   docker compose pull && docker compose up -d   # bila image dibuat CI/CD (DOCKER_IMAGE)
#   docker compose logs -f middleware
#
# Konfigurasi diambil dari .env di folder yang sama (lihat docs/08-konfigurasi.md).

name: middleware-skill-ai

services:
  middleware:
    build: .
    image: ${DOCKER_IMAGE:-middleware-skill-ai:latest}
    container_name: middleware-skill-ai
    restart: unless-stopped

    env_file: .env
    # nilai berikut selalu menang atas .env, supaya isi .env untuk development
    # (APP_ENV=development, PATH_FILE_UPLOAD=skills, ...) tidak terbawa ke container
    environment:
      APP_ENV: production
      GIN_MODE: release
      PORT: "4000"
      PATH_FILE_UPLOAD: /app/skills
      LOG_DIR: /app/logs
      MCP_CONFIG_PATH: /app/mcp.json
      IMAGE_PATH: /app/images
      WEB_SEARCH_URL: http://searxng:8080
      # pasang MCP dari GitHub: Docker API lewat proxy yang hanya membuka urusan
      # container, dan container MCP di network khusus middleware_mcp_net
      MCP_DOCKER_HOST: tcp://docker-proxy:2375
      MCP_DOCKER_NETWORK: middleware_mcp_net
      MCP_REPOS_PATH: /app/open_source_mcp
      MCP_RUNNER_PUBLISH_HOST: ""

    # API /api/* tidak memakai autentikasi, jadi bawaannya hanya bisa diakses
    # dari VPS sendiri (127.0.0.1); buka ke publik lewat NGINX. Ubah lewat
    # DOCKER_PORT_BIND di .env (mis. 0.0.0.0:4000 untuk membuka langsung).
    ports:
      - "${DOCKER_PORT_BIND:-127.0.0.1:4000}:4000"

    # di Linux, host.docker.internal tidak ada otomatis; baris ini membuatnya
    # menunjuk ke VPS, supaya REDIS_ADDR=host.docker.internal:6379 dan DB di
    # VPS yang sama bisa dijangkau dari container
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - skills_data:/app/skills # skill hasil upload tidak hilang saat container dibuat ulang
      - logs_data:/app/logs
      - images_data:/app/images # gambar hasil generate lewat chat
      - mcp_repos_data:/app/open_source_mcp # clone repo MCP dari GitHub (untuk diperiksa)
      # server MCP bawaan untuk semua user (Canva, ...). Server tambahan tiap user
      # disimpan di database, jadi file ini cukup read-only. Perubahan butuh restart.
      - ./mcp.json:/app/mcp.json:ro

    depends_on:
      searxng:
        condition: service_started
      docker-proxy:
        condition: service_started
      # image runner harus sudah dibangun sebelum MCP pertama dijalankan
      mcp-runner:
        condition: service_completed_successfully

    # default: searxng dan internet; mcp_net: menjangkau container MCP;
    # docker_api: satu-satunya jalan ke Docker (lewat proxy)
    networks:
      - default
      - mcp_net
      - docker_api

    # server diberi waktu menyelesaikan request yang sedang berjalan (termasuk
    # streaming) dan menulis sisa log pemakaian sebelum dihentikan paksa
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # mesin pencari untuk tool web_search (gratis, tanpa API key). Tidak dibuka ke
  # publik: middleware memanggilnya lewat jaringan Docker (http://searxng:8080).
  # Port 127.0.0.1:8888 hanya untuk cek dari VPS sendiri.
  searxng:
    image: searxng/searxng:latest
    container_name: middleware-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?isi SEARXNG_SECRET di .env}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:8888:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # proxy Docker API untuk middleware: hanya membuka urusan container (buat,
  # jalankan, hentikan, hapus, periksa, log). Exec, image, volume, network,
  # build, swarm, dan lainnya ditutup. Socket Docker hanya dipasang di sini,
  # tidak pernah di container middleware atau container MCP. Network docker_api
  # internal: tidak bisa diakses dari luar maupun dari container MCP.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: middleware-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # hanya membangun image runner untuk MCP dari GitHub (git, Node 22, pnpm,
  # Python, uv, supergateway), lalu langsung selesai. Container MCP dibuat
  # middleware dari image ini.
  mcp-runner:
    build: ./docker/mcp-runner
    image: ${MCP_RUNNER_IMAGE:-middleware-mcp-runner:latest}
    command: ["true"]
    restart: "no"
    network_mode: none

networks:
  default:
  # container MCP dari GitHub hanya tersambung ke network ini (bukan ke
  # default/docker_api), jadi tidak bisa menjangkau searxng atau Docker API
  mcp_net:
    name: middleware_mcp_net
    driver: bridge
  docker_api:
    internal: true

volumes:
  skills_data:
  logs_data:
  images_data:
  mcp_repos_data:
